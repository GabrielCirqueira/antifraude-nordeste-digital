# Exemplo para a VPS (nginx). Ajuste server_name e root.
server {
  listen 80;
  server_name seudominio.com.br;
  root /var/www/antifraude-nordeste-digital;
  index index.html;
  location / { try_files $uri $uri/index.html $uri.html =404; }
  location ~* \.(webp|pdf|pptx)$ { expires 7d; add_header Cache-Control "public"; }
  # /dashboard -> /dashboard/ (nginx redireciona sozinho para a pasta)
}
