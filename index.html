<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Antifraude Nordeste Digital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: guia de telas à esquerda (só no desktop) e um aparelho com status bar, tela rolável e barra de navegação flutuante. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#0E1F26; --muted:#5B6D73; --line:#E0E8E7;
  --brand:#0D6B6E; --brand-ink:#FFFFFF; --brand-soft:#DCF0EE; --sun:#F4A63A;
  --hi:#D92D20; --hi-bg:#FDE8E6; --mid:#B54708; --mid-bg:#FEF0C7; --lo:#067647; --lo-bg:#DCF5E6;
  --lo-solid:#067647; --lo-ink:#FFFFFF;
  --hero-a:#0A2830; --hero-b:#0F5A60;
  --shadow:0 1px 2px rgba(14,31,38,.05),0 10px 28px rgba(14,31,38,.07);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --pad:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081114; --surface:#0F1B1F; --surface-2:#13242A; --ink:#E9F1F2; --muted:#93A8AD; --line:#1D3238;
    --brand:#3CC4B9; --brand-ink:#04231F; --brand-soft:#11302F;
    --hi:#FF8A80; --hi-bg:#3B1816; --mid:#F6B960; --mid-bg:#3A2A0C; --lo:#6FD39A; --lo-bg:#11301E;
    --lo-solid:#6FD39A; --lo-ink:#052414; --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081114; --surface:#0F1B1F; --surface-2:#13242A; --ink:#E9F1F2; --muted:#93A8AD; --line:#1D3238;
  --brand:#3CC4B9; --brand-ink:#04231F; --brand-soft:#11302F;
  --hi:#FF8A80; --hi-bg:#3B1816; --mid:#F6B960; --mid-bg:#3A2A0C; --lo:#6FD39A; --lo-bg:#11301E;
  --lo-solid:#6FD39A; --lo-ink:#052414; --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:56px}
.aside{display:none}
.device{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#view{display:flex;flex-direction:column;flex:1;min-height:0}
.sbar{display:none}

@media (min-width:600px){
  :root{--pad:14px}
  body{padding-block:20px}
  .device{width:410px;max-height:880px;border:9px solid #0A1417;border-radius:46px;box-shadow:0 30px 60px rgba(8,20,24,.25)}
  .sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font-size:13px;font-weight:600}
}
@media (min-width:1000px){
  .aside{display:block;width:320px;flex:none}
}
/* guia lateral */
.aside h2{font:800 30px/1.05 var(--f-display);margin:0 0 10px;letter-spacing:-.02em}
.aside p{margin:0 0 18px;color:var(--muted)}
.aside .jl{display:grid;gap:8px}
.aside .jb{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.aside .jb:hover{border-color:var(--brand)}
.aside .jb small{color:var(--muted);font-weight:400}
.aside .tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:600;margin-bottom:10px}
.aside .fine{margin-top:16px;font-size:12.5px;color:var(--muted)}

/* cabeçalhos */
.hero{position:relative;margin:4px var(--pad) 0;border-radius:26px;padding:16px 18px 18px;color:#fff;overflow:hidden;background:linear-gradient(155deg,var(--hero-a),var(--hero-b))}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(244,166,58,.38),rgba(244,166,58,0) 65%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font:700 15px var(--f-display);letter-spacing:.01em}
.hero h1{font:800 26px/1.1 var(--f-display);margin:0 0 4px;letter-spacing:-.02em}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.hero p b{color:#fff}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tile{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;min-width:0}
.tile b{display:block;font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:rgba(255,255,255,.75)}
.tile.warn b{color:#FFB4AB}
.split{margin-top:14px}
.split .sb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.14);gap:2px}
.split .sb i{display:block;height:100%}
.split .lg{display:flex;gap:14px;margin-top:8px;font-size:12px;color:rgba(255,255,255,.8)}
.split .lg span{display:inline-flex;align-items:center;gap:6px}
.split .lg em{width:8px;height:8px;border-radius:50%;display:inline-block;font-style:normal}

.top{display:flex;align-items:center;gap:10px;padding:10px var(--pad) 8px;min-width:0}
.top h1{font:800 22px/1.1 var(--f-display);margin:0;letter-spacing:-.015em}
.top .sub{color:var(--muted);font-size:12.5px}
.top .grow{flex:1;min-width:0}
.back{width:44px;height:44px;margin-left:-8px;border:0;background:none;display:grid;place-items:center;border-radius:14px;color:var(--ink);flex:none}
.back:hover{background:var(--brand-soft)}
.avatar.s{background:var(--brand-soft);color:var(--brand)}

.screen{flex:1;min-height:0;overflow-y:auto;padding:12px var(--pad) 18px;display:flex;flex-direction:column;gap:12px}
.nav{margin:6px var(--pad) 10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);padding:4px}
.tab{position:relative;min-height:56px;border:0;background:none;border-radius:18px;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft);font-weight:600}
.tab .cnt{position:absolute;top:5px;left:calc(50% + 6px);background:var(--hi);color:#fff;border-radius:99px;font-size:10.5px;min-width:17px;padding:0 5px;line-height:17px;text-align:center}
.tab .dotw{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--hi);border:2px solid var(--surface)}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card h2{font:700 15px/1.2 var(--f-display);margin:0 0 12px}
.card h2 small{font:400 12.5px var(--f-body);color:var(--muted);margin-left:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;min-height:48px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);padding:12px 0}
.search:focus-within{border-color:var(--brand)}
.row2{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.wrap{white-space:normal;text-align:left}
select.sel{flex:none;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.oc{display:grid;grid-template-columns:52px 1fr;gap:6px 14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.oc:hover{border-color:var(--brand)}
.ring{--c:var(--lo);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font:800 16px var(--f-display);font-variant-numeric:tabular-nums}
.ring.big{width:64px;height:64px}.ring.big::before{inset:6px}.ring.big b{font-size:20px}
.oc-main{min-width:0}
.oc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.oc-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-val{font:800 17px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-sub{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:2px}
.ch{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:500}
.oc-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.due{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.due.urgent{color:var(--hi)}
.status{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.status.ret{background:var(--mid-bg);color:var(--mid)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.p-liberar,.p-ok{background:var(--lo-bg);color:var(--lo)} .p-reter,.p-warn{background:var(--mid-bg);color:var(--mid)} .p-rejeitar,.p-bad{background:var(--hi-bg);color:var(--hi)}
.note{color:var(--muted);font-size:12.5px;margin:2px 2px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border-radius:18px;padding:12px 14px;background:var(--mid-bg);color:var(--mid);border:1px solid transparent;font-size:13.5px}
.banner.bad{background:var(--hi-bg);color:var(--hi)}
.banner b{display:block}

/* detalhes */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{min-height:40px;border:0;background:none;border-radius:11px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,31,38,.12)}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:290px;display:block;margin:0 auto}
.gauge .gn{font:800 46px/1 var(--f-display);margin-top:-2px;font-variant-numeric:tabular-nums}
.gauge .gn small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.gauge .gb{margin-top:6px;display:flex;flex-direction:column;gap:2px;align-items:center}
.gauge .gb b{font-size:15px}
.gauge .gb span{color:var(--muted);font-size:13px}
.sla{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sla .tp{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.sla .tp b{font:800 20px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.sla.urgent .tp b{color:var(--hi)}
.sla .pb{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.sla .pb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.sla.urgent .pb i{background:var(--hi)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere;font-weight:500}
.who{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.who .av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;display:grid;place-items:center;flex:none}
.who b{display:block;font-size:16px}
.who span{color:var(--muted);font-size:12.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp > div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;font-size:13px;overflow-wrap:anywhere}
.cmp small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.cmp .diff{background:var(--mid-bg);border-color:transparent;color:var(--mid)}
.cmp .diff small{color:var(--mid)}
.sg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.sg:first-of-type{border-top:0;padding-top:0}
.sg .lb{font-weight:600}
.sg .w{font-family:var(--f-mono);font-weight:500;font-size:13.5px;color:var(--brand)}
.sg .why{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.sg .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.sg .bar i{display:block;height:100%;background:var(--brand)}
.sg.off{opacity:.5}
.sg.off .w{color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:2px solid var(--line);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tl .ic.now{background:var(--mid-bg);color:var(--mid);animation:pulse 1.8s infinite}
.tl .ic.liberar{background:var(--lo-bg);color:var(--lo)}.tl .ic.rejeitar{background:var(--hi-bg);color:var(--hi)}.tl .ic.reter{background:var(--mid-bg);color:var(--mid)}
.tl b{display:block;font-size:14px}
.tl span{color:var(--muted);font-size:12.5px}
.tl .tm{font-family:var(--f-mono);font-size:11.5px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(181,71,8,.35)}50%{box-shadow:0 0 0 6px rgba(181,71,8,0)}}

/* barras de ação */
.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;padding:10px var(--pad) 12px;border-top:1px solid var(--line);background:var(--bg)}
.act{min-height:52px;border-radius:16px;border:1.5px solid transparent;font-weight:600}
.act.rej{background:var(--hi-bg);color:var(--hi)}
.act.ret{background:var(--mid-bg);color:var(--mid)}
.act.lib{background:var(--lo-solid);color:var(--lo-ink)}
.bottom{padding:10px var(--pad) 12px;border-top:1px solid var(--line);background:var(--bg)}
.btn{width:100%;min-height:52px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:16px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.link{background:none;border:0;color:var(--muted);min-height:44px;font-size:14px;text-decoration:underline}

/* decisão */
.sum{display:flex;align-items:center;gap:14px}
.sum .o-val{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.opts{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-weight:600;font-size:14px;display:block;margin-bottom:8px}
.opt{display:grid;grid-template-columns:40px 1fr 22px;gap:2px 12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer}
.opt .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;grid-row:1/3}
.opt.o-liberar .oi{background:var(--lo-bg);color:var(--lo)}.opt.o-reter .oi{background:var(--mid-bg);color:var(--mid)}.opt.o-rejeitar .oi{background:var(--hi-bg);color:var(--hi)}
.opt .ot{font-weight:600}
.opt .od{color:var(--muted);font-size:12.5px;grid-column:2}
.opt input{grid-row:1/3;grid-column:3;width:20px;height:20px;accent-color:var(--brand);margin:0}
.opt.sel.o-liberar{border-color:var(--lo)}.opt.sel.o-reter{border-color:var(--mid)}.opt.sel.o-rejeitar{border-color:var(--hi)}
textarea{width:100%;min-height:96px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;outline:0}
textarea:focus{border-color:var(--brand)}
.help{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;margin-top:6px}
.sheet-bg{position:absolute;inset:0;background:rgba(5,12,11,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:22px 18px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font:800 21px var(--f-display);margin:0}
.sheet .quote{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;overflow-wrap:anywhere}
.sheet .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .pf{display:flex;align-items:center;gap:14px}
.sheet .pf .avatar{width:54px;height:54px;font-size:18px}

/* sucesso */
.done{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:20px 0 4px}
.checkc{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--lo-bg);color:var(--lo);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.checkc.reter{background:var(--mid-bg);color:var(--mid)}.checkc.rejeitar{background:var(--hi-bg);color:var(--hi)}
.checkc svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.done h1{font:800 26px/1.1 var(--f-display);margin:6px 0 0}
.done .card{width:100%;text-align:left}

/* histórico */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{text-align:center}
.stat3 b{display:block;font:800 24px var(--f-display)}
.stat3 span{font-size:12px;color:var(--muted)}
.sbar2{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-top:12px;background:var(--line)}
.sbar2 i{display:block;height:100%}
.day{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.h-item{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.h-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h-line{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.just{margin:6px 0 0;font-size:14px;overflow-wrap:anywhere}
.h-meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.h-body{min-width:0}
details summary{cursor:pointer;font-size:13px;color:var(--brand);font-weight:600;min-height:34px;display:flex;align-items:center}
pre{margin:4px 0 0;padding:12px;border-radius:12px;background:var(--surface-2);font-family:var(--f-mono);font-size:11.5px;line-height:1.55;overflow-x:auto;white-space:pre}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;align-self:center;min-height:40px}

/* integração */
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.pc-name{display:flex;align-items:center;gap:8px;font:700 16px var(--f-display)}
.pc-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:52px;padding:0 2px;border-bottom:1px solid var(--line)}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--brand);min-height:4px;opacity:.85}
.bars i.f{background:var(--hi)}.bars i.r{background:var(--muted);opacity:.5}.bars i.h{background:var(--mid)}
.pinfo{font-size:13px;margin:10px 0;min-height:38px}
.use{display:grid;gap:10px;margin:4px 0 12px}
.use .u{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.use .ub{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.use .ub i{display:block;height:100%;background:var(--brand);transition:width .4s}
.use .uv{font-family:var(--f-mono);color:var(--ink);font-size:12px}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.cfg div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.cfg dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cfg dd{margin:2px 0 0;font-weight:600;font-size:13px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.log li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:12.5px}
.log .t{font-family:var(--f-mono);color:var(--muted)}
.log .bad{color:var(--hi)}.log .warn{color:var(--mid)}.log .ok{color:var(--lo)}

.sw{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw span{font-weight:500;font-size:14px}.sw small{grid-column:1;color:var(--muted);font-size:12px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tg2{grid-column:2;grid-row:1/3;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw .tg2::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked + .tg2{background:var(--brand)}
.sw input:checked + .tg2::after{transform:translateX(18px)}
.sw input:focus-visible + .tg2{outline:2px solid var(--brand);outline-offset:2px}
.sw .wt{font-family:var(--f-mono);color:var(--brand);font-weight:500;font-size:13px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wrow span{font-weight:500;font-size:14px}.wrow small{grid-column:1;color:var(--muted);font-size:12px}
.wst{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.wst button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px/1 var(--f-body);cursor:pointer}
.wst button:disabled{opacity:.35;cursor:default}
.wst output{min-width:44px;text-align:center;font:500 16px var(--f-mono);color:var(--brand)}
.wrow.chg output{color:var(--ink);font-weight:700}
.band3{display:grid;gap:8px}
.band3 div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:14px}
.band3 b{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.band3 .l{background:var(--lo-bg);color:var(--lo)}.band3 .m{background:var(--mid-bg);color:var(--mid)}.band3 .h{background:var(--hi-bg);color:var(--hi)}
.band3.dim div{opacity:.35}.band3.dim div.on{opacity:1;outline:2px solid currentColor}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.chk li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:13.5px}
.chk .ok{width:24px;height:24px;border-radius:50%;background:var(--lo-bg);color:var(--lo);display:grid;place-items:center}

/* login */
.login{flex:1;margin:4px var(--pad) 10px;border-radius:30px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:30px 24px 24px;position:relative;overflow:hidden}
.login::after{content:"";position:absolute;left:-80px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(244,166,58,.35),rgba(244,166,58,0) 65%)}
.login > *{position:relative;z-index:1}
.login h1{font:800 38px/1 var(--f-display);margin:18px 0 8px;letter-spacing:-.03em}
.login p{margin:0;color:rgba(255,255,255,.78)}
.lg-card{display:grid;gap:10px}
.who2{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:12px 14px}
.who2 .avatar{background:rgba(255,255,255,.2)}
.who2 span{display:block;font-size:12.5px;color:rgba(255,255,255,.72)}
.btn.sun{background:var(--sun);color:#2B1A00}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.lg-card small{color:rgba(255,255,255,.7);font-size:12px;text-align:center;margin-top:2px}

#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast,.use .ub i,.tl .ic.now,.checkc,.checkc svg path{transition:none;animation:none}.checkc svg path{stroke-dashoffset:0}}

  function ring(s,big){return '<div class="ring'+(big?' big':'')+'" style="--p:'+s+';--c:var(--'+bandKey(s)+')"><b>'+s+'</b></div>';}

  /* medidor semicircular */
  function pt(r,v){var th=(180-v*1.8)*Math.PI/180;return [110+r*Math.cos(th),110-r*Math.sin(th)];}
  function arc(v1,v2,r){var a=pt(r,v1),b=pt(r,v2);return 'M'+a[0].toFixed(2)+' '+a[1].toFixed(2)+' A'+r+' '+r+' 0 0 1 '+b[0].toFixed(2)+' '+b[1].toFixed(2);}
  function gauge(score,nid){
    var lbl=[0,30,60,100].map(function(v){var p=pt(106,v);return '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+(v===0||v===100?4:-1)).toFixed(1)+'" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-mono)">'+v+'</text>';}).join('');
    return '<div class="gauge"><svg viewBox="0 0 220 124" role="img" aria-label="Pontuação de risco '+score+' de 100">'+
      '<path d="'+arc(1,29,90)+'" stroke="var(--lo)" stroke-width="13" stroke-linecap="round" fill="none"/>'+
      '<path d="'+arc(31,59,90)+'" stroke="var(--mid)" stroke-width="13" stroke-linecap="round" fill="none"/>'+
      '<path d="'+arc(61,99,90)+'" stroke="var(--hi)" stroke-width="13" stroke-linecap="round" fill="none"/>'+lbl+
      '<g id="'+nid+'" data-needle="'+score+'" style="transform-origin:110px 110px;transform:rotate(-90deg);transition:transform .9s cubic-bezier(.2,.8,.2,1)"><path d="M107 108 110 36 113 108z" fill="var(--ink)"/></g>'+
      '<circle cx="110" cy="110" r="8" fill="var(--ink)"/><circle cx="110" cy="110" r="3" fill="var(--surface)"/></svg>'+
      '<div class="gn"><span id="'+nid+'-n">'+score+'</span><small>/100</small></div>'+
      '<div class="gb"><b id="'+nid+'-b" style="color:var(--'+bandKey(score)+')">'+bandName(score)+'</b><span id="'+nid+'-r">'+bandRule(score)+'</span></div></div>';
  }
  function setNeedle(id,v){var g=document.getElementById(id);if(g)g.style.transform='rotate('+(v*1.8-90)+'deg)';}
  function animateNeedles(){
    var gs=document.querySelectorAll('g[data-needle]');
    if(!gs.length)return;
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      for(var i=0;i<gs.length;i++){gs[i].style.transform='rotate('+(Number(gs[i].getAttribute('data-needle'))*1.8-90)+'deg)';}
    });});

  /* ---------- simulação de integração (circuit breaker) ---------- */
  var PART={
    A:{k:'A',nome:'Marketplace A',lim:'Limite do parceiro: 120 req/min',timeout:3,ret:3,base:'1 s',cap:'8 s',thr:5,rein:30,bulk:20,rate:100,rateUse:62,bulkUse:6},
    B:{k:'B',nome:'Marketplace B',lim:'Limite do parceiro: 40 req/min',timeout:5,ret:2,base:'2 s',cap:'16 s',thr:3,rein:60,bulk:10,rate:35,rateUse:21,bulkUse:3},
    C:{k:'C',nome:'Marketplace C',lim:'Parceiro de menor volume',timeout:4,ret:3,base:'1 s',cap:'8 s',thr:5,rein:30,bulk:15,rate:50,rateUse:28,bulkUse:5}
  };
  var LOG=[];
  Object.keys(PART).forEach(function(k){var p=PART[k];p.state='closed';p.failing=false;p.fails=0;p.count=0;p.half=0;p.queue=0;p.bars=[];for(var i=0;i<24;i++)p.bars.push({t:'o',ms:120+Math.random()*260});});
  function plog(msg,kind){LOG.unshift({t:hms(new Date()),msg:msg,kind:kind||''});if(LOG.length>40)LOG.pop();if(state.view==='integ')renderLog();}
  function pLabel(p){if(p.state==='open')return ['Circuito aberto','bad'];if(p.state==='half')return ['Meio-aberto','warn'];if(p.failing)return ['Degradado','warn'];return ['Operando','ok'];}
  function barH(b){return b.t==='f'?100:(b.t==='r'?10:(b.t==='h'?60:20+Math.max(0,(b.ms-120))/260*25));}
  function simTick(){
    var changed=false;
    Object.keys(PART).forEach(function(k){
      var p=PART[k];
      if(p.state==='closed'){
        if(p.failing){
          p.fails++;p.bars.push({t:'f',ms:p.timeout*1000});
          plog(p.nome+': timeout após '+p.timeout+' s (falha '+p.fails+' de '+p.thr+')','bad');
          if(p.fails>=p.thr){p.state='open';p.count=p.rein;changed=true;plog(p.nome+': circuito aberto. Chamadas recusadas na hora e pedidos enfileirados.','bad');}
        }else{p.fails=0;p.bars.push({t:'o',ms:120+Math.random()*260});}
      }else if(p.state==='open'){
        p.count--;p.queue++;p.bars.push({t:'r',ms:0});
        if(p.count<=0){p.state='half';p.half=2;changed=true;plog(p.nome+': meio-aberto, enviando uma chamada de teste.','warn');}
      }else{
        p.half--;p.bars.push({t:'h',ms:0});
        if(p.half<=0){
          if(p.failing){p.state='open';p.count=p.rein;plog(p.nome+': o teste falhou, circuito reaberto por mais '+p.rein+' s.','bad');}
          else{plog(p.nome+': teste com sucesso, circuito fechado. '+p.queue+' pedidos reprocessados com a mesma chave de idempotência, sem duplicar.','ok');p.state='closed';p.fails=0;p.queue=0;}
          changed=true;
        }
      }
      if(p.bars.length>24)p.bars.shift();
    });
    if(changed&&state.view==='panel')render();
    if(state.view==='integ')updateInteg();
  }

  function dayLabel(iso){

    if(same(d,t))return 'Hoje';if(same(d,y))return 'Ontem';
    return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
  }
  function histList(){

      if(f!=='todas'&&r.decisao!==f)return false;

      return true;
    });
    if(!shown.length)return '<div class="empty"><b>Nada por aqui</b>Nenhuma decisão com este filtro.</div>';

  function updateInteg(){
    var okc=0;
    Object.keys(PART).forEach(function(k){
      var p=PART[k],lab=pLabel(p),el;
      if(p.state==='closed'&&!p.failing)okc++;
      el=document.getElementById('pp-'+k);if(!el)return;
      el.className='pill p-'+lab[1];el.textContent=lab[0];
      document.getElementById('pb-'+k).innerHTML=p.bars.map(function(b){return '<i class="'+b.t+'" style="height:'+barH(b)+'%"></i>';}).join('');
      var info;
      if(p.state==='open')info='<b>Chamadas recusadas na hora.</b> Reinício em '+p.count+' s · '+p.queue+' pedidos na fila de reprocessamento.';
      else if(p.state==='half')info='<b>Meio-aberto.</b> Enviando uma única chamada de teste.';
      else if(p.failing)info='<b>Timeout de '+p.timeout+' s atingido.</b> Falhas: '+p.fails+' de '+p.thr+' para abrir o circuito.';
      else info='<b>Respondendo normalmente</b> · cerca de '+Math.round(p.bars.filter(function(b){return b.t==='o';}).slice(-5).reduce(function(a,b){return a+b.ms;},0)/Math.max(1,p.bars.filter(function(b){return b.t==='o';}).slice(-5).length))+' ms por chamada.';
      document.getElementById('pi-'+k).innerHTML=info;
      var ru=(p.state==='open'?0:(p.state==='half'?1:p.rateUse)),bu=(p.state==='closed'?(p.failing?Math.min(p.bulk,p.bulkUse+p.fails*3):p.bulkUse):0);
      document.getElementById('ur-'+k).style.width=(ru/p.rate*100)+'%';document.getElementById('urv-'+k).textContent=ru+'/'+p.rate+' req/min';
      document.getElementById('ub-'+k).style.width=(bu/p.bulk*100)+'%';document.getElementById('ubv-'+k).textContent=bu+'/'+p.bulk+' threads';
      var btn=document.getElementById('pbtn-'+k),txt=p.failing?'Restaurar parceiro':'Simular falha';
      if(btn.textContent!==txt)btn.textContent=txt;
    });
    var ih=document.getElementById('ih');if(ih){ih.style.setProperty('--p',okc/3*100);ih.style.setProperty('--c',okc===3?'var(--lo)':(okc===0?'var(--hi)':'var(--mid)'));ih.querySelector('b').textContent=okc+'/3';}
  }

  function wrows(){return SKEYS.map(function(k){var g=SIGNALS[k],c=g.w!==DEFW[k];

  setInterval(function(){

      var el=els[i],ms=Number(el.getAttribute('data-deadline'))-Date.now(),t=el.querySelector('.t');
      var txt=(el.getAttribute('data-prefix')||'')+remain(ms);
      if(t)t.textContent=txt;else el.textContent=txt;
      el.classList.toggle('urgent',ms<3600000);
    }
    var cl=document.querySelectorAll('[data-clock]');for(var j=0;j<cl.length;j++)cl[j].textContent=hm(new Date());
    simTick();
  },1000);

  render();
})();
</script>
</body>
</html>
